spring.application.name=sistema-ventas-api
server.address=${VENTAS_API_ADDRESS:0.0.0.0}
server.port=${VENTAS_API_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${VENTAS_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=SistemaVentas;encrypt=false;loginTimeout=5}
spring.datasource.username=${VENTAS_DB_USER:}
spring.datasource.password=${VENTAS_DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=4000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
ventas.usuario-operador=${VENTAS_USUARIO_OPERADOR:admin}
